spring.application.name=bidding-system-backend
server.port=8080

# CORS Configuration
  spring.web.resources.add-mappings=true

# MySQL Datasource (XAMPP default: user root, empty password)
spring.datasource.url=jdbc:mysql://localhost:3306/bidding_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# Enable Scheduling for Automated Auction Closure Task
spring.task.scheduling.pool.size=2
